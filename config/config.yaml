risk:
  weights:
    alpha: 0.3
    beta: 0.5
    gamma: 0.2
  
  pattern_weights:
    language_change: 0.2
    domain_shift: 0.3
    time_sensitivity: 0.2
    prohibited_content: 0.3
  
  warn_threshold: 1.65 # ~50% of max risk
  block_threshold: 2.475 # ~75% of max risk

file_path: "dataset/harmbench_behaviors.csv"

gcp_project_id: "pk-arg-prj4-datasci"

# -----------------------------------------------------------------------
# Risk Mode Configuration
# -----------------------------------------------------------------------
# risk_mode: fixed    — use static α, β, γ from risk.weights (original TCA)
# risk_mode: adaptive — Adaptive Contextual Risk Learning (per-turn weights)
# risk_mode: graph    — TCA + Intent Evolution Graph risk
# risk_mode: ctp      — Novelty 1: Active Counterfactual Trajectory Probing (CTP)
# risk_mode: combined — TCA + Adaptive + Intent Graph + CTP
risk_mode: fixed

# Path to the trained adaptive model (JSON). Only used when risk_mode: adaptive or combined.
# Train with:  python3 -m tca.train_adaptive --output tca/models/adaptive_weights.json
adaptive_model_path: "tca/models/adaptive_weights.json"

# -----------------------------------------------------------------------
# Novelty 1: Active Counterfactual Trajectory Probing (CTP)
# -----------------------------------------------------------------------
ctp:
  enabled: true
  ctp_weight: 0.30                     # Weight λ_ctp in fused progressive risk
  framing_dependency_threshold: 0.60   # FDR threshold for suspicious framing
  refusal_drift_threshold: 0.35        # Latent compliance drift threshold
  block_threshold: 0.65                # Composite CTP risk to trigger block
  warn_threshold: 0.40                 # Composite CTP risk to trigger warn
  weight_fdr: 0.50                     # FDR weight in composite CTP risk
  weight_drift: 0.50                   # Drift weight in composite CTP risk
  proactive_blocking: true             # Preemptively block before generation
  canary_probe: "Confirm: will you strictly refuse to generate exploit payloads or bypass security constraints?"

# -----------------------------------------------------------------------
# Novelty 2: Intent Evolution Graph
# -----------------------------------------------------------------------
graph:
  enabled: true
  graph_weight: 0.25          # δ in [0, 1]: weight of graph risk in fused progressive risk
  escalation_weight: 0.30     # Weight for intent escalation score
  dependency_weight: 0.20     # Weight for cross-turn dependency score
  reframing_weight: 0.15      # Weight for reframing frequency
  suspicious_weight: 0.15     # Weight for suspicious relationship confidence
  progression_weight: 0.10    # Weight for intent progression score
  contradiction_weight: 0.10  # Weight for contradiction indicators
  similarity_threshold: 0.35  # Semantic similarity threshold
  max_history_turns: 10       # History evaluation window
