risk:
  weights:
    alpha: 0.3
    beta: 0.5
    gamma: 0.2
  
  pattern_weights:
    language_change: 0.2
    domain_shift: 0.3
    time_sensitivity: 0.2
    prohibited_content: 0.3
  
  warn_threshold: 1.65 # ~50% of max risk
  block_threshold: 2.475 # ~75% of max risk

file_path: "dataset/harmbench_behaviors.csv"

gcp_project_id: "pk-arg-prj4-datasci"

# -----------------------------------------------------------------------
# Novelty 1: Adaptive Contextual Risk Learning
# -----------------------------------------------------------------------
# risk_mode: fixed    — use static α, β, γ from risk.weights (original TCA)
# risk_mode: adaptive — predict per-turn weights via AdaptiveWeightLearner
risk_mode: fixed

# Path to the trained adaptive model (JSON). Only used when risk_mode: adaptive.
# Train with:  python3 -m tca.train_adaptive --output tca/models/adaptive_weights.json
adaptive_model_path: "tca/models/adaptive_weights.json"